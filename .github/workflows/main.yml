name : Postman Collection Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron : '30 9 * * 0'
    - cron : '15 10 * * 0'

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.0.0

      - name: Install Nodejs and npm
        uses: actions/setup-node@v6.0.0
        with:
          node version: '22'

      - name: Install Newman and Html Extra
        run: |
             npm install -g newman
             npm install -g newman-reporter-htmlextra

      - name: Run Collection
        run: |
             newman run 'Inwarranty-flow Collection.postman_collection.json' \
             -e QA.postman_environment.json \
             -d testData.csv \
             -r cli,htmlextra \
             --reporter-htmlextra-export ./newman/index.html

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: Newman Report
          path: newman/*.html


      - name: Creating github page Actions
        if: always()
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/


      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v9
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_NAME }}
          password: ${{ secrets.PAGES_MAIL }}
          subject: Phoenix Inwarranty Flow Test Execution Notification
          to: sharmapunit11699@gmail.com
          from: ${{ secrets.EMAIL_NAME }}
          body: |
                  Hi,
                   The report has been completed and the URL is :
                   https://sidh100arth.github.io/Phoneix-Inwarranty-Flow/
          



          
